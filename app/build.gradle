plugins {
    id 'com.android.application'
}

android {
    namespace 'com.displaymodeblocker'
    compileSdk 36

    defaultConfig {
        applicationId "com.displaymodeblocker"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    // A fixed, publicly known debug-grade key committed to the repository.
    // It keeps the APK signature identical across CI runs so that new builds
    // install over old ones without uninstalling first. This module is meant
    // for personal sideloading only.
    signingConfigs {
        shared {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    compileOnly files('lib/XposedBridgeApi-82.jar')
}
